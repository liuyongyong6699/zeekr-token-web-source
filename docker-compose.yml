# Zeekr Token Local Web - Docker Compose for ARM64
# Usage: docker compose up -d

version: '3.8'

services:
  zeekr-token-web:
    build:
      context: .
      dockerfile: Dockerfile
      # For multi-arch builds, use buildx:
      # docker buildx build --platform linux/arm64,linux/amd64 -t zeekr-token-web .
    container_name: zeekr-token-web
    restart: unless-stopped
    ports:
      - "8767:8767"  # Host port 8767 -> container 8767
    environment:
      - NODE_ENV=production
      - PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      # Optional: Change port inside container
      # - ZEEKR_WEB_PORT=8767
    volumes:
      # Optional: persist nothing (stateless)
      # If you want to persist session data between restarts:
      # - ./data:/app/data
    # Chromium in containers needs --no-sandbox, which requires privileged or specific capabilities
    # --no-sandbox is already in the code; these capabilities allow it:
    cap_add:
      - SYS_ADMIN
      - CAP_DAC_OVERRIDE
    # Security: drop unnecessary capabilities
    cap_drop:
      - ALL
    # Memory limit for Chromium
    mem_limit: 1g
    cpus: '1.5'
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Health check is defined in Dockerfile
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8767/api/bootstrap"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# For multi-arch (ARM64 + AMD64) build:
# docker buildx create --use
# docker buildx build --platform linux/arm64,linux/amd64 -t yourname/zeekr-token-web:latest --push .